name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload into. Does not move or delete the tag.
        required: true
        default: v0.1.0
        type: string
      platforms:
        description: Which installers to build and upload
        required: true
        type: choice
        options:
          - macos
          - windows
          - all
        default: macos

# Job-level if cannot read matrix (GitHub rejects that expression at dispatch).
# Platform choice is therefore two jobs. They share one concurrency group so
# latest.json is rewritten one platform at a time and Windows entries already
# on the release are kept. The tag itself is never moved or deleted.
jobs:
  publish-macos:
    name: publish (macos)
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: labtrace-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash .github/scripts/resolve-release-tag.sh

      # Empty GitHub secrets arrive as empty strings. Tauri then tries
      # `security import -f pkcs12` and the macOS bundle fails. This step
      # exports a variable only when it has a value. Without an Apple
      # certificate it sets APPLE_SIGNING_IDENTITY=- so the app is ad-hoc
      # signed and not notarized. TAURI_SIGNING_PRIVATE_KEY is unchanged.
      - name: Prepare OS signing environment
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/export-signing-env.sh

      - name: Build and upload macOS Apple Silicon
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: LabTrace ${{ steps.release.outputs.tag }}
          releaseBody: |
            LabTrace ${{ steps.release.outputs.tag }}

            Windows installers are Authenticode-signed only when WINDOWS_CERTIFICATE is set.
            macOS installers are Developer ID signed and notarized only when the Apple secrets are set; otherwise they are ad-hoc signed.
            See the README for how to open an unsigned or ad-hoc build.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Build and upload macOS Intel
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: LabTrace ${{ steps.release.outputs.tag }}
          releaseBody: |
            LabTrace ${{ steps.release.outputs.tag }}

            Windows installers are Authenticode-signed only when WINDOWS_CERTIFICATE is set.
            macOS installers are Developer ID signed and notarized only when the Apple secrets are set; otherwise they are ad-hoc signed.
            See the README for how to open an unsigned or ad-hoc build.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-apple-darwin

  publish-windows:
    name: publish (windows)
    if: ${{ github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: labtrace-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash .github/scripts/resolve-release-tag.sh

      - name: Prepare OS signing environment
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/export-signing-env.sh

      - name: Build and upload Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: LabTrace ${{ steps.release.outputs.tag }}
          releaseBody: |
            LabTrace ${{ steps.release.outputs.tag }}

            Windows installers are Authenticode-signed only when WINDOWS_CERTIFICATE is set.
            macOS installers are Developer ID signed and notarized only when the Apple secrets are set; otherwise they are ad-hoc signed.
            See the README for how to open an unsigned or ad-hoc build.
          releaseDraft: false
          prerelease: false
